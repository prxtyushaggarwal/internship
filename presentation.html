      {

          <div class="max-w-4xl w-full space-y-6">

              </div>
              <div class="p-4 rounded-xl bg-slate-900 border border-slate-800">
                <span class="font-mono text-amber-400 text-xs">02</span>
                <div class="font-bold text-white text-sm mt-1">Notice Missing Details</div>
              </div>

              <div class="p-4 rounded-xl bg-slate-900 border border-slate-800">
                <span class="font-mono text-emerald-400 text-xs">04</span>
                <div class="font-bold text-white text-sm mt-1">Decide Next Action</div>

            </div>
            <div class="p-4 rounded-xl bg-slate-900/60 border border-slate-800 text-center text-xs text-slate-400">
              Low-fidelity is enough: Paper screens or clickable flows test the logic before building a service.

        code: "INT335 · P24 / 09",
        subtitle: "Design Thinking · 05 Test",

          <div class="max-w-4xl w-full space-y-6">
            <h2 class="text-3xl font-extrabold text-white">Design Thinking · 05 Test: Observe Decisions, Not Just Reactions</h2>

    ];

    let current = 0;
    function render() {
      const s = slides[current];
      document.getElementById('deck-code').innerText = s.code;
      document.getElementById('deck-subtitle').innerText = s.subtitle;
      document.getElementById('deck-counter').innerText = `Slide ${current + 1} of ${slides.length}`;
      document.getElementById('stage').innerHTML = s.html;
      document.getElementById('prev-btn').disabled = current === 0;
      document.getElementById('next-btn').innerText = current === slides.length - 1 ? 'Go to App' : 'Next';
      lucide.createIcons();
    }

    function next() {
      if (current < slides.length - 1) {
        current++;
        render();
      } else {
        window.location.href = 'index.html';
      }
    }

    function prev() {
      if (current > 0) {
        current--;
        render();
      }
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') next();
      if (e.key === 'ArrowLeft') prev();
    });

    render();
  </script>
</body>
</html>
